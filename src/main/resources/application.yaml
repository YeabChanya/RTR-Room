spring:
  application:
    name: RTR-Room

  datasource:
    url: jdbc:postgresql://localhost:5434/mydatabase
    username: myuser
    password: secret
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
